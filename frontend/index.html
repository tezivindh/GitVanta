<html lang="en">

    <meta name="description" content="GitVanta scores your GitHub portfolio from 0 to 100 across six categories, shows exactly how the score was calculated, and lists the fixes that raise it. Free, with a shareable public profile." />
    <link rel="canonical" href="__SITE_URL__/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0e1629" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1629" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GitVanta" />
    <meta property="og:title" content="GitVanta: your GitHub portfolio, scored and explained" />
    <meta property="og:description" content="A 0–100 score across six categories, the exact fixes that raise it, AI-written README and resume help, and a shareable profile." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GitVanta: your GitHub portfolio, scored and explained" />
    <meta name="twitter:description" content="A 0–100 score across six categories and the exact fixes that raise it." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      (function () {
        try {
          var raw = localStorage.getItem('theme-storage');
          var state = raw ? JSON.parse(raw).state || {} : {};
          var mode = state.mode || (state.darkMode === true ? 'dark' : state.darkMode === false ? 'light' : 'system');
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          // The browser chrome follows the in-app theme, not only the OS one.
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute('content', '#0e1629');
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>GitVanta needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
